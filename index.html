<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полтавська Область - Радар</title>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0b0e14; color: white; font-family: 'Courier New', monospace; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; background: #0b0e14; }
        
        .radar-ui {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(10, 15, 20, 0.9); padding: 20px; border-radius: 4px;
            border-left: 4px solid #ff4d4d; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            min-width: 250px; pointer-events: none;
        }

        .ui-title { font-size: 10px; color: #58a6ff; letter-spacing: 3px; margin-bottom: 10px; opacity: 0.8; }
        .ui-stat { font-size: 18px; margin-bottom: 5px; font-weight: bold; }
        .ui-timer { font-size: 12px; color: #8b949e; }
        
        .pulse-dot {
            display: inline-block; width: 8px; height: 8px; background: #ff4d4d;
            border-radius: 50%; margin-right: 10px; animation: blink 1s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="radar-ui">
    <div class="ui-title">СИСТЕМА МОНІТОРИНГУ ПОВІТРЯНИХ ЦІЛЕЙ</div>
    <div class="ui-stat"><span class="pulse-dot"></span>ЦІЛЕЙ В ОБЛАСТІ: <span id="target-count">0</span></div>
    <div class="ui-timer" id="session-time">ЧАС РОБОТИ: 00:00:00</div>
</div>

<div id="map"></div>

<script>
    // 1. КОНФІГ FIREBASE (Встав сюди свої ключі!)
    const firebaseConfig = {
        apiKey: "ТВІЙ_API_KEY",
        databaseURL: "https://ТВІЙ_PROJECT.firebaseio.com",
        projectId: "ТВІЙ_PROJECT_ID",
        appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. ІКОНКИ (Твої SVG)

        'shahed': `data:image/svg+xml;base64,${btoa('<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.51 600.51"><path fill="%23ff9900" d="M555.25,562.35c4.13-39.1.99-44.59.99-44.59-.09-.21-.19-.44-.3-.68-2.23-4.99-7.93-15.47-9.66-18.64-.18-.33-.31-.68-.47-1.03-.02-.75-.04-1.48-.06-2.18,0-.02,0-.05,0-.07,0-.27-.02-.5-.02-.76-.02-.55-.03-1.09-.05-1.62-.52-16.97-1.35-21.39-1.35-21.39l-111.64-153.95c-.02-.52-.2-6.52-.23-7.93-.07-3.73,0-12.69,0-12.69l-.28-1.63h-.46l-.28,1.63h0s.078.96,0,12.69c-.03,1.46-.23,5.82-.23,5.89l-100.51-138.6h0s0,0,0,0h0s0,0,0,0v-65.98c-1.83-92.34-30.42-88.48-30.42-88.48,0,0-28.59-3.86-30.42,88.48v65.98l-99.41,137.09v-2.96l-.6-1.77v-48.57l-.6-3.5h-.97l-.6,3.5v48.57l-.6,1.73v7.65l-110.84,152.85s-.17.92-.41,3.54c-.07.79-.15,1.72-.23,2.84-.05.74-.11,1.56-.16,2.47-.14,2.26-.28,5.04-.41,8.44-.03.68-.05,1.39-.08,2.12-.07,1.96-.13,4.13-.19,6.47-.17.39-.32.79-.53,1.17-1.73,3.17-7.43,13.65-9.66,18.64-.05.12-.1.23-.15.34-.18.17-.28.33-.28.33l.2-.16c-.02.05-.05.11-.07.16,0,0-3.14,5.49.99,44.59l12.8-12.85h1.05s1.41,0,1.41,0h0s.44,0,.44,0l32.84-.07h0s68.42-.17,68.42-.17h103.11s.2-27.98.2-27.98h-.1l.11-8.02h5.28c0,.18,0,.3,0,.3,0,0,.26,4.08,8.51,6.91h-3.01s-.02,0-.03,0c-.13,0-.25.03-.35.09,0,0-.02,0-.03,0-.19.12-.48.36-.74.78,0,0,0,0,0-.01h0s-.93,0-.93,0c-2.46-.81-3.99-.94-5.02-.25-.92.62-1.17,1.74-1.23,2.72-.59.33-.43,1.06-.43,1.06l.61,3.55h-1.18s-.63.19-.63,1.53.63,1.53.63,1.53h3.08v5.07s.04,2.67,1.68,2.67h2.84v-.37s.01-.07,0-.1c.03.7.17,1.6.72,1.6h14.03v-3.19h.18v1.84s0,.14.3.14h.76v2.43h-.49s-.56.67-.56,2.73v-.28h-.18v-3.57s-.03.06-.08.14v-.13h-.38s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.28s0,0,0,0h-.42s0,0,0,0h-.28s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.28s0,0,0,0h-.47s-.02,0-.03,0c-.13,0-.25.03-.35.09,0,0-.02,0-.03,0-.19.12-.47.35-.72.76h-.86c-2.46-.81-3.99-.94-5.02-.25-.92.62-1.17,1.74-1.23,2.72-.59.33-.43,1.06-.43,1.06l.61,3.55h-1.18s-.63.19-.63,1.53.63,1.53.63,1.53h3.08v5.07s.04,2.67,1.68,2.67h2.8c.07.58.25,1.13.68,1.13h14.03v-.14c.05.08.08.14.08.14v-3.19h.18v1.84s0,0,0,.01v2.77c-2.5.8-4.04,1.87-4.04,3.05,0,2.32,2.43,3.63,5.33,4.38.16.04.32.08.48.11.27.39.96,1.13,2.38,1.78v.7s.14.03.36.06h0s.07.85.88.9c-3.59-.14-26.59-.9-46.01,1.31-.1.01-.18.07-.23.16l-.71,1.21c-.13.22,0,.51.23.54,3.22.45,21.53,2.81,41.1,1.03,2.89-.26,5.78.15,8.59.88.67.18,1.52.29,2.59.29,1.43,0,2.46-.21,3.21-.5,2.67-1.01,5.54-1.29,8.39-1.23,8.92.17,25.41.17,39.92-1.47.1-.01.18-.07.23-.16l.71-1.21c.13-.22,0-.51-.23-.54-3.55-.5-25.47-3.32-47.19-.34v-.98h0c2.8-.73,3.88-1.95,4.23-2.46,3.06-.73,5.7-2.05,5.7-4.46,0-.62-.42-1.21-1.18-1.74h10.89c.43,0,.61-.56.68-1.13h2.81c1.64,0,1.67-2.67,1.67-2.67v-5.07h3.09s.63-.19.63-1.53-.63-1.53-.63-1.53h-1.18l.61-3.55s.16-.73-.43-1.06c-.06-.98-.31-2.11-1.23-2.72-1.03-.69-2.56-.55-5.02.25h-.86c-.25-.41-.53-.64-.72-.76,0,0-.02,0-.03,0-.1-.06-.22-.09-.35-.09,0,0-.02,0-.03,0h-.47s0,0,0,0h-.28s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.28s0,0,0,0h-.42s0,0,0,0h-.28s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.41s0,0,0,0h-.29s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.4s0,0,0,0h-.3s0,0,0,0h-.38v.13c-.05-.08-.08-.14-.08-.14v3.57h-.18v.28c0-2.06-.56-2.73-.56-2.73h-.49v-1.54c19.45-1.83,19.92-9.14,19.92-9.14,0,0,0-.13,0-.31h0s5.27,0,5.27,0l.12,8.02h-.09l.2,27.98h.34s102.78,0,102.78,0h.11s.31,0,.31,0l100.68.24h0s.21,0,.21,0h2.78s12.8,12.85,12.8,12.85Z"/></svg>')}`
    };

    // 3. КАРТА ПОЛТАВСЬКОЇ ОБЛАСТІ
    const map = new maplibre-gl.Map({
        container: 'map',
        // Використовуємо надійне джерело стилів
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [34.551, 49.588], // Координати Полтави
        zoom: 8.5, // Збільшений зум для області
        attributionControl: false
    });

    // Фікс для прогрузки карти
    map.on('load', () => {
        map.resize();
        console.log("Карта Полтавської області готова");
    });

    const markers = {};

    // 4. ТАЙМЕР СЕССІЇ (Українською)
    let startTime = Date.now();
    function updateTimer() {
        const diff = Date.now() - startTime;
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById('session-time').innerText = `ЧАС РОБОТИ: ${h}:${m}:${s}`;
    }
    setInterval(updateTimer, 1000);

    // 5. ОНОВЛЕННЯ ДАНИХ (Тільки Полтавщина)
    db.ref('targets').on('value', (snapshot) => {
        const data = snapshot.val();
        let count = 0;
        
        // Межі Полтавської області для фільтрації
        const latMin = 48.7, latMax = 50.5;
        const lngMin = 32.1, lngMax = 36.3;

        for (let id in markers) {
            if (!data || !data[id]) {
                markers[id].remove();
                delete markers[id];
            }
        }

        if (data) {
            for (let id in data) {
                const t = data[id];
                // Перевірка, чи ціль в межах області
                if (t.lat >= latMin && t.lat <= latMax && t.lng >= lngMin && t.lng <= lngMax) {
                    count++;
                    if (!markers[id]) {
                        const el = document.createElement('div');
                        el.style.width = '45px';
                        el.style.height = '45px';
                        el.style.backgroundImage = `url("${svgIcons[t.type] || svgIcons.shahed}")`;
                        el.style.backgroundSize = 'contain';
                        el.style.backgroundRepeat = 'no-repeat';
                        
                        const glowColor = t.type === 'ballistic' ? 'rgba(255,50,50,0.8)' : 'rgba(255,150,0,0.8)';
                        el.style.filter = `drop-shadow(0 0 10px ${glowColor})`;
                        
                        markers[id] = new maplibre-gl.Marker(el)
                            .setLngLat([t.lng, t.lat])
                            .addTo(map);
                    } else {
                        markers[id].setLngLat([t.lng, t.lat]);
                    }
                }
            }
        }
        document.getElementById('target-count').innerText = count;
    });

</script>
</body>
</html>
